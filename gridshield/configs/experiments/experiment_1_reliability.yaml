# --- Interrupt-and-resume scenarios (audit fix #4) -------------------------
# The scenarios above never simulate a process crash, so a fresh
# CheckpointStore never has any prior state to resume from — in every one
# of them, "checkpointing" is mechanically identical to
# "exponential_backoff" plus the overhead of writing checkpoint markers.
# That is an honest, disclosed finding, not a bug, and those scenarios are
# left as-is. The three scenarios below are additive: each simulates a
# process crash partway through a repetition (after 3 of 6 units, under
# grid_points_limit: 2, no fault injection so interruption survival is the
# only variable under test) and then reruns the full pass with the same
# strategy/checkpoint store, so checkpointing's actual value proposition —
# resuming without redoing completed work — is directly measurable via
# api_calls and runtime_seconds, instead of asserted only by unit test.
- scenario_id: baseline__interrupted
  reliability_strategy: baseline
  fault_type: none
  fault_probability: 0.0
  simulate_interruption_after_units: 3
- scenario_id: exponential_backoff__interrupted
  reliability_strategy: exponential_backoff
  fault_type: none
  fault_probability: 0.0
  reliability_params: *id002
  simulate_interruption_after_units: 3
- scenario_id: checkpointing__interrupted
  reliability_strategy: checkpointing
  fault_type: none
  fault_probability: 0.0
  reliability_params: *id003
  simulate_interruption_after_units: 3

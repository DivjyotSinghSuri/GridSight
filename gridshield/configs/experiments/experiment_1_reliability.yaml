# Experiment 1: Reliability benchmark.
#
# Compares GridShield's four reliability strategies (Baseline, Retry,
# Backoff, Checkpointing) under each of the 4 injected fault types at
# each of the required fault probabilities (0%, 10%, 20%, 25%), plus a
# no-fault control per strategy. Metrics collected by the runner for
# every repetition: Recovery Rate, Recovery Time, Runtime, API Calls,
# Data Completeness (see gridshield/metrics/reliability_metrics.py).
#
# grid_points_limit: 2 is a deliberate practicality default (keeps a
# 15-repetition x 52-scenario run tractable given GridSight's own
# built-in per-call courtesy sleep) — it does not change fault-injection
# or reliability-strategy semantics, only how many of the 25 grid points
# are sampled per repetition. Override per-scenario or edit this file's
# `defaults` to use the full grid for a formal run.
#
# max_attempts is held at 5 for fixed_retry, exponential_backoff, AND
# checkpointing (audit fix: previously fixed_retry used max_attempts: 3
# while the other two used 5, confounding the strategy comparison with
# an unequal retry budget). Only the retry *timing* (fixed delay vs.
# exponential backoff) and checkpointing behavior now differ between
# scenarios — the number of attempts available does not.
experiment_id: experiment_1_reliability
defaults:
  validation_strategy: none
  repetitions: 15
  master_seed: 42
  grid_points_limit: 2
  run_date: '2026-07-25'
scenarios:
- scenario_id: baseline__no_fault
  reliability_strategy: baseline
  fault_type: none
  fault_probability: 0.0
- scenario_id: baseline__http_429__10pct
  reliability_strategy: baseline
  fault_type: http_429
  fault_probability: 0.1
- scenario_id: baseline__http_429__20pct
  reliability_strategy: baseline
  fault_type: http_429
  fault_probability: 0.2

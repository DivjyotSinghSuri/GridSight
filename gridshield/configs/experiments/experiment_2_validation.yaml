- scenario_id: python__missing_rows
  validation_strategy: python
  validation_params:
    inject_violation: missing_rows
- scenario_id: python__schema_mismatch
  validation_strategy: python
  validation_params:
    inject_violation: schema_mismatch
- scenario_id: python__invalid_numeric_range
  validation_strategy: python
  validation_params:
    inject_violation: invalid_numeric_range
- scenario_id: python__wrong_datatype
  validation_strategy: python
  validation_params:

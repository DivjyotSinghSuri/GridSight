# Experiment 1 — NO-RESILIENCE BASELINE mirror.
#
# Byte-for-byte identical scenario matrix to
# ``configs/experiments/experiment_1_reliability.yaml`` (same fault types,
# probabilities, reliability strategies, repetitions=15, master_seed=42,
# grid_points_limit=2, run_date). The only experimental variable changed is
# that this run executes inside
# ``gridshield.fault_injection.internal_resilience_toggle.disable_gridsight_internal_resilience()``,
# which forces GridSight's own fetcher-level retry budget (normally 5, see
# handbook Chapter 12.1's "internal-retry confound") down to 1 attempt, so
# faults reach GridShield's reliability layer unabsorbed. GridShield's own
# four reliability strategies (baseline/fixed_retry/exponential_backoff/
# checkpointing) are NOT modified — this isolates "does GridSight's own
# resilience explain the confound" from "do GridShield's strategies work",
# without touching the original experiment_1_reliability.yaml or its output
# directory in any way.
#
# See docs/handbook/12_major_discoveries.md §12.1 for the finding this
# baseline experiment was designed to isolate.
experiment_id: experiment_1_reliability_no_resilience_baseline
defaults:
  validation_strategy: none
  repetitions: 15
  master_seed: 42
  grid_points_limit: 2
  run_date: '2026-07-25'
scenarios:
- scenario_id: baseline__no_fault
